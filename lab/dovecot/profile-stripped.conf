# Stripped profile: flat namespace (as ISPConfig) with MOVE, UIDPLUS and ESEARCH not advertised.
namespace inbox {
  inbox = yes
  separator = .
  prefix =
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# Stripped: the same flat layout, but CAPABILITY lists no MOVE, UIDPLUS or ESEARCH. Dovecot still
# runs those commands and still sends APPENDUID/COPYUID, so a fallback test must also check which
# commands the connector sent (tests/_lab.py record_commands), not only that the result is right.
protocol imap {
  imap_capability {
    MOVE = no
    UIDPLUS = no
    ESEARCH = no
  }
}
