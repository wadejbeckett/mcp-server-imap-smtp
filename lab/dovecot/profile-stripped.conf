# Stripped profile: flat namespace (as ISPConfig) with MOVE, UIDPLUS and ESEARCH not advertised.
namespace inbox {
  inbox = yes
  separator = .
  prefix =
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# Stripped: the same flat layout, but the server advertises no MOVE, UIDPLUS or ESEARCH, so the
# connector's fallbacks (COPY + STORE \Deleted + EXPUNGE, plain SEARCH) can be tested.
protocol imap {
  imap_capability {
    MOVE = no
    UIDPLUS = no
    ESEARCH = no
  }
}
