# Dovecot 2.4 lab configuration. The namespace and capability differences between lab profiles
# live in profile-*.conf; LAB_PROFILE chooses one at container start.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

protocols = imap lmtp sieve
listen = *
log_path = /dev/stderr

ssl = required
ssl_server_cert_file = /lab/tls/server.pem
ssl_server_key_file = /lab/tls/server.key
ssl_min_protocol = TLSv1.2

auth_mechanisms = plain login
passdb passwd-file {
  passwd_file_path = /etc/dovecot/lab/users
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user | domain}/%{user | username}
  }
}

mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_index = yes

mail_plugins {
  quota = yes
  acl = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_acl = yes
  }
  imap_metadata = yes
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

quota "User quota" {
  driver = count
  storage_size = 100M
}
acl_driver = vfile
mail_attribute {
  dict file {
    path = ~/dovecot-attributes
  }
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

service imap-login {
  # 143: STARTTLS required (ssl = required: no login, LOGINDISABLED, until TLS is up).
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

!include_try /etc/dovecot/lab/active-profile.conf
