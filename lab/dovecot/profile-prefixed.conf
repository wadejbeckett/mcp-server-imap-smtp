# INBOX.-prefixed namespace: every folder is a child of INBOX (the layout Plesk's Dovecot uses).
namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
