[project]
name = "mcp-server-imap-smtp"
version = "0.1.0"
description = "Remote MCP server that lets AI apps work with IMAP and SMTP mailboxes on the mail servers you bind it to."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.1,<3", "cryptography>=42", "html2text>=2024.2", "httpx>=0.27", "idna>=3.6", "uvicorn>=0.30", "dnspython>=2.6"]
keywords = ["mcp", "model-context-protocol", "mcp-server", "imap", "smtp", "email", "oauth", "ai"]
# The licence is the SPDX expression above (PEP 639); a "License ::" classifier beside it is refused.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
]

[project.urls]
Homepage = "https://github.com/wadejbeckett/mcp-server-imap-smtp"
Repository = "https://github.com/wadejbeckett/mcp-server-imap-smtp"
Issues = "https://github.com/wadejbeckett/mcp-server-imap-smtp/issues"
Documentation = "https://github.com/wadejbeckett/mcp-server-imap-smtp/blob/main/docs/RUNNING.md"
Changelog = "https://github.com/wadejbeckett/mcp-server-imap-smtp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
mcp-server-imap-smtp = "mcp_server_imap_smtp.app:main"
mcp-server-imap-smtp-admin = "mcp_server_imap_smtp.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]   # pinned: the build backend is fetched at build time
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to real mailboxes (credentials from the file named by MCP_TEST_ENV_FILE)",
    "lab: talks to the container test lab (start it with scripts/lab.sh up)",
]
addopts = "-m 'not integration and not lab'"
