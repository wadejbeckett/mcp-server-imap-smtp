# @NAME@ nginx site for @MCP_HOSTNAME@ -> 127.0.0.1:@LISTEN_PORT@.
# Rendered by deploy/install.sh into /etc/nginx/sites-available/@NAME@.conf, overwriting it on
# every run. Lines tagged "# ipv6" are dropped on hosts without IPv6. Before the certificate exists,
# install.sh installs only the part above "BEGIN TLS" so Let's Encrypt can reach the ACME webroot.

# Access log without query strings: /authorize and /login URLs carry OAuth state, PKCE challenges and
# sign-in request ids, which the gateway already keeps out of its own log.
# The error log cannot drop them: on an upstream error (for example the few seconds of a restart) nginx
# writes the full request line, query string included. This site's servers therefore log errors to
# their own @NAME@.error.log, rotated with Debian's nginx logs (daily, 14 kept); see docs/DEPLOY.md.
log_format mcp_server_imap_smtp_noquery '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

# Requests for any other name (or a bare IP) get no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;  # ipv6
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/@NAME@.access.log mcp_server_imap_smtp_noquery;
    error_log /var/log/nginx/@NAME@.error.log error;
    return 444;
}

server {
    listen 80;
    listen [::]:80;  # ipv6
    server_name @MCP_HOSTNAME@;
    server_tokens off;
    access_log /var/log/nginx/@NAME@.access.log mcp_server_imap_smtp_noquery;
    error_log /var/log/nginx/@NAME@.error.log error;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://@MCP_HOSTNAME@$request_uri;
    }
}

# BEGIN TLS
upstream mcp_server_imap_smtp {
    server 127.0.0.1:@LISTEN_PORT@;
    keepalive 16;
}

# TLS for any other name is refused during the handshake (no certificate is offered).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;  # ipv6
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;  # ipv6
    server_name @MCP_HOSTNAME@;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/@MCP_HOSTNAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@MCP_HOSTNAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mcp_server_imap_smtp_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/@NAME@.access.log mcp_server_imap_smtp_noquery;
    error_log /var/log/nginx/@NAME@.error.log error;

    # Tool calls carry attachments as base64 (about 4/3 of the file size), so 32 MB of request is about 23 MB
    # of files in one message. The sign-in and manage forms keep their own 2 MB limit in the app. A larger
    # value needs memory to match: one call holds several copies of its message while building it.
    client_max_body_size 32m;

    location / {
        proxy_pass http://mcp_server_imap_smtp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # keep upstream connections alive; no hop-by-hop passthrough
        proxy_set_header Host $host;                  # the gateway's DNS-rebinding check expects @MCP_HOSTNAME@
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the client cannot inject an address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_buffering off;                          # streamable HTTP / SSE responses go out as they are produced
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# END TLS
